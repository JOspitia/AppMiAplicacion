# ===================================
# DATABASE (PostgreSQL)
# ===================================
spring.datasource.url=jdbc:postgresql://localhost:5432/myapplication_test
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# ===================================
# CONNECTION POOL (HikariCP) - Optimized for 500+ concurrent users
# ===================================
# Maximum number of connections in the pool. 
# Formula: ((core_count * 2) + effective_spindle_count)
# For high throughput, 30-50 is usually sufficient. 500 would kill the DB.
spring.datasource.hikari.maximum-pool-size=40

# Minimum number of idle connections to maintain
spring.datasource.hikari.minimum-idle=10

# Maximum time (ms) to wait for a connection from the pool
spring.datasource.hikari.connection-timeout=30000

# Maximum time (ms) a connection can stay idle
spring.datasource.hikari.idle-timeout=600000

# Maximum lifetime (ms) of a connection in the pool
spring.datasource.hikari.max-lifetime=1800000

# Test query to validate connection
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Logging Configuration
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.level.org.springframework.security=DEBUG

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true
spring.flyway.ignore-migration-patterns=*:missing

