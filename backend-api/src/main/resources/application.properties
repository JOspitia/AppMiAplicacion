# ==========================================
# CONFIGURACIÓN DE SUBIDA DE ARCHIVOS
# ==========================================
# 1. Límite de CONTEO DE PARTES (Archivos + Campos).
# Este es el valor que por defecto es 50 y te causa el error FileCountLimitExceeded.
server.tomcat.max-part-count=50000

# 2. Límite de parámetros (el que cuenta campos URL-encoded, ya lo tenías bien, pero aseguramos)
server.tomcat.max-parameter-count=50000

# 3. Límite de Tamaño Total de la Petición
spring.servlet.multipart.max-request-size=200MB 

# 4. Solución para el error de conexión en archivos grandes
server.tomcat.max-swallow-size=-1

