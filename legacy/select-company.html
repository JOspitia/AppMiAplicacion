<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Seleccionar Empresa | MiAplicación</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Consolidated Styles (Tailwind + Legacy Landing) -->
    <link th:href="@{/css/main.css?v=20251221194456}" rel="stylesheet">

    <!-- Theme Script Fragment -->
    <script th:replace="~{fragments/public-layout :: theme-script}"></script>

    <style>
        .company-card-premium {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--shadow-xl);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .company-card-premium:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: var(--shadow-glow);
        }

        .item-glow {
            position: absolute;
            width: 100px;
            height: 100px;
            background: var(--primary);
            filter: blur(60px);
            opacity: 0;
            transition: var(--transition);
            pointer-events: none;
        }

        .company-card-premium:hover .item-glow {
            opacity: 0.1;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6 relative overflow-x-hidden">
    <!-- Ambient Glow from Landing -->
    <div class="ambient-glow"></div>

    <!-- Theme Toggle -->
    <div class="fixed top-6 right-6 z-50">
        <button onclick="toggleDarkMode()" class="theme-toggle" aria-label="Cambiar tema">
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </div>

    <div class="w-full max-w-[500px] relative py-12">
        <!-- Header -->
        <div class="text-center mb-10 animate-fade-in">
            <h1 class="navbar-title text-3xl mb-3">
                <span class="gradient-text">Mi</span>Aplicación
            </h1>
            <p class="text-text-secondary font-medium">Selecciona tu empresa para continuar</p>
        </div>

        <!-- Selection Container -->
        <div class="space-y-4 animate-fade-in" style="animation-delay: 0.1s">
            <form th:action="@{/select-company}" method="post" class="space-y-4">
                <div th:each="company, iterStat : ${companies}">
                    <button type="submit" name="companyId" th:value="${company.id}"
                        class="company-card-premium w-full group p-5 rounded-2xl flex items-center justify-between outline-none animate-fade-in"
                        th:style="'animation-delay: ' + (0.2 + ${iterStat.index * 0.1}) + 's'">
                        <div class="item-glow -top-10 -left-10"></div>

                        <div class="text-left relative z-10">
                            <span
                                class="block font-bold text-text-primary group-hover:text-primary transition-colors text-lg"
                                th:text="${company.name}">Empresa</span>
                            <span class="block text-xs font-semibold text-text-muted mt-0.5"
                                th:text="${'NIT: ' + company.nit}">NIT: 000</span>
                        </div>

                        <div class="relative z-10 text-text-muted group-hover:text-primary transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </div>
                    </button>
                </div>
            </form>
        </div>

        <p class="text-center text-text-muted text-xs mt-10 font-medium">
            © 2025 MiAplicación. Todos los derechos reservados.
        </p>
    </div>
</body>

</html>
