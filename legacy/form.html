<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::#main-content-area})}">

<head>
    <title th:text="${role.id != null ? 'Editar Rol' : 'Crear Nuevo Rol'}"></title>
</head>

<body>
    <div id="main-content-area">
        <div class="container-fluid px-6 py-4">
            <div class="mb-6 flex justify-between items-center border-b border-gray-200 dark:border-gray-700 pb-4">
                <h1 class="text-2xl font-bold text-gray-800 dark:text-white">
                    <span th:text="${role.id != null ? 'Editar Rol' : 'Crear Nuevo Rol'}"></span>
                </h1>
                <a th:href="@{/core/management/roles}"
                    class="inline-flex items-center px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700">
                    Volver
                </a>
            </div>

            <div th:if="${errorMessage}"
                class="p-4 mb-4 text-sm text-red-800 rounded-lg bg-red-50 dark:bg-gray-800 dark:text-red-400"
                role="alert">
                <span class="font-medium">Error!</span> <span th:text="${errorMessage}"></span>
            </div>

            <div th:if="${successMessage}"
                class="p-4 mb-4 text-sm text-green-800 rounded-lg bg-green-50 dark:bg-gray-800 dark:text-green-400"
                role="alert">
                <span class="font-medium">Éxito!</span> <span th:text="${successMessage}"></span>
            </div>

            <form
                th:action="${role.id != null ? '/core/management/roles/edit/' + role.id : '/core/management/roles/create'}"
                th:object="${role}" method="post" class="space-y-6">

                <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 space-y-4">
                    <h2 class="text-lg font-semibold text-gray-800 dark:text-white border-b pb-2">
                        Información Básica
                    </h2>
                    <div>
                        <label for="name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                            Nombre del Rol
                        </label>
                        <input type="text" id="name" th:field="*{name}" required
                            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
                    </div>
                    <div>
                        <label for="description" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                            Descripción
                        </label>
                        <textarea id="description" th:field="*{description}" rows="3"
                            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"></textarea>
                    </div>
                </div>

                <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 space-y-6">
                    <div class="flex justify-between items-center border-b pb-2">
                        <h2 class="text-lg font-semibold text-gray-800 dark:text-white">Permisos</h2>
                        <div class="text-sm">
                            <button type="button" onclick="toggleAll(true)"
                                class="text-blue-600 hover:underline mr-2 dark:text-blue-400">
                                Seleccionar Todo
                            </button>
                            <button type="button" onclick="toggleAll(false)"
                                class="text-gray-600 hover:underline dark:text-gray-400">
                                Deseleccionar Todo
                            </button>
                        </div>
                    </div>

                    <div class="space-y-4" th:if="${permissionsGrouped != null and !permissionsGrouped.isEmpty()}">
                        <div class="border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden"
                            th:each="moduleEntry : ${permissionsGrouped}">

                            <div
                                class="bg-gray-100 dark:bg-gray-700 px-4 py-3 border-b border-gray-200 dark:border-gray-600">
                                <h5 class="mb-0 font-bold text-gray-800 dark:text-white flex items-center">
                                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                                    </svg>
                                    <span th:text="${moduleEntry.key}">Nombre Módulo</span>
                                </h5>
                            </div>

                            <div class="p-4 bg-white dark:bg-gray-800">
                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    <div class="resource-card border border-gray-200 dark:border-gray-700 rounded-lg shadow-sm h-full"
                                        th:each="resourceEntry : ${moduleEntry.value}">

                                        <div
                                            class="bg-gray-5 dark:bg-gray-900 px-3 py-2 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                                            <strong
                                                class="text-xs uppercase text-gray-500 dark:text-gray-400 tracking-wider"
                                                th:text="${resourceEntry.key}">Recurso</strong>
                                            <input type="checkbox"
                                                class="resource-checkbox w-3.5 h-3.5 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600"
                                                onclick="toggleResource(this)">
                                        </div>

                                        <div class="p-3 space-y-2">
                                            <div class="flex items-start" th:each="perm : ${resourceEntry.value}">
                                                <div class="flex items-center h-5">
                                                    <input type="checkbox" name="permissionIds" th:value="${perm.id}"
                                                        th:id="${'perm_' + perm.id}"
                                                        th:checked="${assignedPermissionIds != null and assignedPermissionIds.contains(perm.id)}"
                                                        class="permission-checkbox w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600"
                                                        onchange="updateResourceHeaderState(this)">
                                                </div>
                                                <div class="ml-2 text-sm">
                                                    <label
                                                        class="font-medium text-gray-700 dark:text-gray-300 cursor-pointer select-none"
                                                        th:for="${'perm_' + perm.id}"
                                                        th:text="${perm.description}">Descripción</label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div th:if="${permissionsGrouped == null or permissionsGrouped.isEmpty()}"
                        class="text-center py-8 text-gray-500 dark:text-gray-400">
                        <svg class="mx-auto h-12 w-12 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                            </path>
                        </svg>
                        <p>No hay permisos disponibles para esta compañía.</p>
                    </div>
                </div>

                <div class="flex justify-end space-x-3">
                    <a th:href="@{/core/management/roles}"
                        class="px-5 py-2.5 text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700">
                        Cancelar
                    </a>
                    <button type="submit"
                        class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">
                        Guardar
                    </button>
                </div>
            </form>
        </div>

        <script th:inline="javascript">
            /**
             * MAIN INITIALIZATION LOGIC
             * Wrapped in an IIFE to handle logic safely.
             */
            (function () {

                function initRolePage() {
                    // console.log('Role form script loaded');

                    // Initialization Logic: 
                    // Set initial states of resource header checkboxes based on their children.
                    // This logic runs once when the page/component is fully ready.
                    document.querySelectorAll('.resource-card').forEach(resourceCard => {
                        const headerCheckbox = resourceCard.querySelector('.resource-checkbox');
                        const permissionCheckboxes = Array.from(resourceCard.querySelectorAll('.permission-checkbox'));

                        if (headerCheckbox && permissionCheckboxes.length > 0) {
                            // Calculate states
                            const allChecked = permissionCheckboxes.every(cb => cb.checked);
                            const someChecked = permissionCheckboxes.some(cb => cb.checked);

                            // Set initial state
                            if (allChecked) {
                                headerCheckbox.checked = true;
                                headerCheckbox.indeterminate = false;
                            } else if (someChecked) {
                                headerCheckbox.checked = false;
                                headerCheckbox.indeterminate = true;
                            } else {
                                headerCheckbox.checked = false;
                                headerCheckbox.indeterminate = false;
                            }
                        }
                    });
                }

                // START EXECUTION
                // Standard check: SPA navigation (ready) vs Full Reload (loading)
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', initRolePage);
                } else {
                    initRolePage();
                }

            })();

            /* ==========================================
               GLOBAL UI FUNCTIONS
               These must remain global to be accessible 
               via HTML attributes like onclick="..."
               ========================================== */

            /**
             * Toggle all checkboxes on the page
             * @param {boolean} checked - Whether to check or uncheck all checkboxes
             */
            function toggleAll(checked) {
                document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    cb.checked = checked;
                    // Reset indeterminate state when toggling all
                    if (cb.classList.contains('resource-checkbox')) {
                        cb.indeterminate = false;
                    }
                });
            }

            /**
             * Toggle all permission checkboxes within a resource card (Parent -> Child)
             * @param {HTMLInputElement} headerCheckbox - The resource header checkbox that was clicked
             */
            function toggleResource(headerCheckbox) {
                // 1. Find the resource card container
                const resourceCard = headerCheckbox.closest('.resource-card');
                if (!resourceCard) return;

                // 2. Get the state of the parent checkbox
                const isChecked = headerCheckbox.checked;

                // 3. Find all permission checkboxes within this resource card
                const permissionCheckboxes = resourceCard.querySelectorAll('.permission-checkbox');

                // 4. Apply the parent's state to all children
                permissionCheckboxes.forEach(checkbox => {
                    checkbox.checked = isChecked;
                });

                // 5. Reset indeterminate state
                headerCheckbox.indeterminate = false;
            }

            /**
             * Update the resource header checkbox state based on child checkboxes (Child -> Parent)
             * @param {HTMLInputElement} childCheckbox - A permission checkbox that was changed
             */
            function updateResourceHeaderState(childCheckbox) {
                // Find the parent resource card
                const resourceCard = childCheckbox.closest('.resource-card');
                if (!resourceCard) return;

                // Find the header checkbox for this resource
                const headerCheckbox = resourceCard.querySelector('.resource-checkbox');
                if (!headerCheckbox) return;

                // Find all permission checkboxes in this resource
                const permissionCheckboxes = Array.from(resourceCard.querySelectorAll('.permission-checkbox'));

                if (permissionCheckboxes.length === 0) return;

                // Calculate states
                const allChecked = permissionCheckboxes.every(cb => cb.checked);
                const someChecked = permissionCheckboxes.some(cb => cb.checked);

                // Update the header checkbox state
                if (allChecked) {
                    headerCheckbox.checked = true;
                    headerCheckbox.indeterminate = false;
                } else if (someChecked) {
                    headerCheckbox.checked = false;
                    headerCheckbox.indeterminate = true;
                } else {
                    headerCheckbox.checked = false;
                    headerCheckbox.indeterminate = false;
                }
            }
        </script>
    </div>
</body>

</html>
