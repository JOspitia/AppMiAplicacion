# ===================================
# DATABASE (PostgreSQL)
# ===================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/myapplication_test}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

# ===================================
# CONNECTION POOL (HikariCP) - Optimized for 500+ concurrent users
# ===================================
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Logging Configuration
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.level.org.springframework.security=DEBUG

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration/modules/core,classpath:db/migration/modules/rrhh
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true
spring.flyway.ignore-migration-patterns=*:missing

# ===================================
# SESSION CONFIG
# ===================================
server.reactive.session.timeout=2m

# ===================================
# SECURITY (Custom Security, disable default)
# ===================================
app.security.cookie-secure=${APP_SECURITY_COOKIE_SECURE:false}
spring.security.user.name=admin
spring.security.user.password=admin123

# ===================================
# EMAIL CONFIGURATION
# ===================================
spring.mail.enabled=${SPRING_MAIL_ENABLED:true}
resend.api.key=${RESEND_API_KEY:your_resend_api_key}
resend.from.email=${RESEND_FROM_EMAIL:notificaciones@appmiaplicacion.com}

app.base-url=${APP_BASE_URL:http://localhost:8080}
app.contact.email=${APP_CONTACT_EMAIL:admin@example.com}
app.registration.default-company-name=${APP_REG_DEFAULT_COMPANY:PUBLIC}
app.registration.default-role-name=${APP_REG_DEFAULT_ROLE:NUEVO_USUARIO}

# ===================================
# STORAGE (MinIO)
# ===================================
storage.s3.endpoint=${STORAGE_ENDPOINT:http://minio:9000}
storage.s3.region=${STORAGE_REGION:us-east-1}
storage.s3.access-key=${STORAGE_ACCESS_KEY:minioadmin}
storage.s3.secret-key=${STORAGE_SECRET_KEY:minioadmin}
storage.s3.bucket-name=${STORAGE_BUCKET_NAME:public-assets}
storage.s3.public-bucket=${STORAGE_PUBLIC_BUCKET:public-assets}
storage.s3.private-bucket=${STORAGE_PRIVATE_BUCKET:private-assets}

# Anti-Malware (ClamAV)
app.security.clamav.host=${CLAMAV_HOST:clamav}
app.security.clamav.port=${CLAMAV_PORT:3310}


# ==========================================
# CONFIGURACIÓN DE SUBIDA DE ARCHIVOS
# ==========================================
server.tomcat.max-part-count=50000
server.tomcat.max-parameter-count=50000
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB 
server.tomcat.max-swallow-size=-1

# ==========================================
# CHATBOT CONFIGURATION
# ==========================================
chatbot.internal-api-key=${CHATBOT_INTERNAL_API_KEY:default-internal-key}
chatbot.n8n-webhook-url=${CHATBOT_N8N_WEBHOOK_URL:http://n8n_app:5678/webhook-test/message}
chatbot.n8n-api-key=${CHATBOT_N8N_API_KEY:default-n8n-key}

# ===================================
# MERCADO PAGO CONFIGURATION
# ===================================
mercadopago.access_token=${MERCADOPAGO_ACCESS_TOKEN:your_mercadopago_access_token}
mercadopago.public_key=${MERCADOPAGO_PUBLIC_KEY:your_mercadopago_public_key}

# ===================================
# PLAN CONFIGURATION
# ===================================
app.plans.basic.price=2000

# ===================================
# PROXY CONFIGURATION
# ===================================
server.forward-headers-strategy=framework
server.tomcat.remoteip.remote-ip-header=CF-Connecting-IP
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto

# ===================================
# JWT CONFIGURATION
# ===================================
app.jwtSecret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:3600000}
app.jwtRefreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:86400000}
